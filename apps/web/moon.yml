$schema: 'https://moonrepo.dev/schemas/project.json'

type: 'application'
language: 'typescript'

tasks:
  dev:
    command: 'vite'
    description: 'Start Vite development server'
    local: true
    deps:
      - 'shared:build'

  build:
    command: 'vite build'
    description: 'Build web client for production'
    deps:
      - 'shared:build'
    inputs:
      - 'src/**/*'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'package.json'
    outputs:
      - 'dist/'

  preview:
    command: 'vite preview'
    description: 'Preview production build'
    deps:
      - '~:build'

  typecheck:
    command: 'bunx tsc --noEmit'
    description: 'Type check web client code'
